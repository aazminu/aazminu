name: Verify Profile & Portfolio Links

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    name: Profile Catalog, HTML Pages, JSON-LD, Sitemap & Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Checkout abdullahazmi.com portfolio repository
        uses: actions/checkout@v4
        with:
          repository: aazminu/abdullahazmi.com
          path: abdullahazmi.com

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run portfolio verification suite
        run: node --test tests/portfolio.test.mjs
